<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15110B">
<meta name="description" content="CHAI - All Day Eatery. Menu, reviews, social and location.">
<title>CHAI | All Day Eatery</title>
<style>
:root {
  --yellow:#FFD34F; --yellow-soft:#FFE58A; --cream:#FFF9E8;
  --black:#11100D; --muted:#AFA798; --line:rgba(255,255,255,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;color:var(--cream);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(650px 400px at 50% -8%,rgba(255,211,79,.17),transparent 64%),
    radial-gradient(500px 500px at 100% 85%,rgba(255,211,79,.06),transparent 70%),
    linear-gradient(145deg,#100E0A 0%,#19140E 48%,#0C0B09 100%);
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.13;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:48px 48px;
}
a{color:inherit;text-decoration:none}
.page{width:min(100%,560px);margin:auto;padding:24px 16px 34px}
.shell{
  overflow:hidden;padding:30px 18px 22px;border:1px solid var(--line);
  border-radius:32px;background:rgba(25,20,14,.76);
  box-shadow:0 24px 70px rgba(0,0,0,.38);backdrop-filter:blur(16px)
}
.brand{text-align:center;padding:3px 14px 26px}
.logo{display:block;width:min(100%,330px);height:170px;object-fit:contain;margin:0 auto 15px}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;color:var(--yellow);
  font-size:10px;font-weight:850;letter-spacing:.18em;text-transform:uppercase
}
.eyebrow:before,.eyebrow:after{content:"";width:20px;height:1px;background:rgba(255,211,79,.5)}
h1{margin:10px 0 6px;font-size:clamp(28px,7vw,38px);line-height:1;letter-spacing:-.055em}
.tagline{margin:0;color:var(--muted);font-size:13px}
.links{display:grid;gap:10px}
.link{
  min-height:68px;display:grid;grid-template-columns:46px 1fr 22px;align-items:center;
  gap:13px;padding:10px 14px 10px 10px;border:1px solid var(--line);border-radius:15px;
  background:linear-gradient(135deg,rgba(255,255,255,.065),rgba(255,255,255,.025));
  transition:transform .18s ease,border-color .18s ease,background .18s ease
}
.link:hover{transform:translateY(-2px);border-color:rgba(255,211,79,.38);
background:linear-gradient(135deg,rgba(255,211,79,.12),rgba(255,255,255,.035))}
.icon{
  width:46px;height:46px;display:grid;place-items:center;border-radius:13px;
  border:1px solid rgba(255,211,79,.28);background:rgba(255,211,79,.08);color:var(--yellow)
}
.icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.copy strong{display:block;font-size:14px;font-weight:760;letter-spacing:-.01em}
.copy span{display:block;margin-top:2px;color:#928B7D;font-size:11px}
.arrow{color:#756F64;font-size:17px;transition:.18s}
.link:hover .arrow{color:var(--yellow);transform:translate(2px,-2px)}
.menu{margin-bottom:10px;background:var(--yellow);color:var(--black);border-color:var(--yellow);box-shadow:0 12px 30px rgba(255,211,79,.12)}
.menu .icon{background:rgba(17,16,13,.08);border-color:rgba(17,16,13,.18);color:var(--black)}
.menu .copy span{color:#514B3D} .menu .arrow{color:#3B372E}
.menu:hover{background:var(--yellow-soft);border-color:var(--yellow-soft)}
.footer{text-align:center;padding-top:24px;color:#696358;font-size:10px}
.footer b{color:var(--yellow);font-weight:700}
@media(min-width:700px){body{padding:24px 0}.page{padding:0}}
@media(max-width:390px){
  .shell{padding-left:13px;padding-right:13px;border-radius:26px}
  .link{grid-template-columns:43px 1fr 18px;padding-right:11px}
  .icon{width:43px;height:43px} .copy span{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
